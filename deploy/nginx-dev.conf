# Hostinger dev reverse proxy. Credentials and TLS keys are provisioned on the VPS.
server {
  listen 80;
  listen [::]:80;
  server_name dev.imobus.shop;
  location ^~ /.well-known/acme-challenge/ {
    root /home/booking-dev/htdocs/dev.imobus.shop;
    try_files $uri =404;
  }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name dev.imobus.shop;
  ssl_certificate /etc/nginx/ssl-certificates/dev.imobus.shop.crt;
  ssl_certificate_key /etc/nginx/ssl-certificates/dev.imobus.shop.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  auth_basic "Taskist private dev workspace";
  auth_basic_user_file /etc/nginx/taskist-dev.htpasswd;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy same-origin always;
  add_header Cache-Control "private, no-store" always;
  access_log /home/booking-dev/logs/nginx/access.log main;
  error_log /home/booking-dev/logs/nginx/error.log;
  client_max_body_size 64k;
  location ^~ /.well-known/acme-challenge/ {
    auth_basic off;
    root /home/booking-dev/htdocs/dev.imobus.shop;
    try_files $uri =404;
  }
  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
  }
}
